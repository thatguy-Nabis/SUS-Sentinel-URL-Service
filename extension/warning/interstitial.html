<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sentinelkey — Security Warning</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0B1220;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 580px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      color: #ef4444;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f87171;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-safe {
      display: inline-block;
      padding: 12px 28px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 14px;
      margin-right: 12px;
    }
    .btn-unsafe {
      display: inline-block;
      padding: 12px 20px;
      background: transparent;
      color: #6b7280;
      border: 1px solid #374151;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-unsafe:hover { color: #ef4444; border-color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <h1>Deceptive or Malicious Site Ahead</h1>
    <p>
      Sentinelkey detected high-risk phishing or malware patterns associated with this destination. Visiting this page could compromise your credentials or device security.
    </p>
    <div>
      <button class="btn-safe" onclick="window.history.back()">Take Me Back (Recommended)</button>
      <button class="btn-unsafe" onclick="window.location.href=new URLSearchParams(window.location.search).get('proceed')">Proceed Anyway (Unsafe)</button>
    </div>
  </div>
</body>
</html>
