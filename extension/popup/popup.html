<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F7F9FC;
      color: #0B1220;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .url {
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      color: #4b5563;
      margin-bottom: 10px;
    }
    .verdict-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-safe { background: #d1fae5; color: #065f46; }
    .badge-suspicious { background: #fef3c7; color: #92400e; }
    .badge-unsafe { background: #fee2e2; color: #991b1b; }
    .reasons {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
      padding-left: 16px;
    }
    .reasons li { margin-bottom: 4px; }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      text-align: center;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" fill="none" stroke="#2F7BF5" stroke-width="2" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span>Sentinelkey</span>
  </div>
  <div class="card" id="content">
    <div class="url" id="target-url">Checking active page...</div>
    <div id="verdict-container">
      <span class="verdict-badge badge-safe" id="badge">Checking...</span>
    </div>
    <div style="font-size: 11px; font-weight: 600; color: #374151;">Triggered Threat Signals:</div>
    <ul class="reasons" id="reasons-list">
      <li>Inspecting page features...</li>
    </ul>
  </div>
  <div class="footer">
    Zero-knowledge privacy enabled • Nepal Privacy Act 2018
  </div>
  <script src="popup.js"></script>
</body>
</html>
